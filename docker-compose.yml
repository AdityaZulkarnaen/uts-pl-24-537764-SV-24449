x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "10m"
        max-file: "3"

services:
    db:
        image: mysql:8.4.13
        restart: unless-stopped
        logging: *default-logging
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    backend:
        build: ./backend
        image: inventaris-lab-backend:local
        restart: unless-stopped
        logging: *default-logging
        environment:
            APP_NAME: "Inventaris Lab"
            APP_KEY: ${APP_KEY}
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            LOG_CHANNEL: ${LOG_CHANNEL:-stdout}
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
            DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-admin@lab.test}
            DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-password}
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "${BACKEND_PORT:-8000}:8000"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s

    frontend:
        build:
            context: ./frontend
            args:
                VITE_API_BASE_URL: /api
        image: inventaris-lab-frontend:local
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            backend:
                condition: service_healthy
        ports:
            - "${FRONTEND_PORT:-8080}:80"

    # ---------------------------------------------------------------
    # Pemantauan: Prometheus mengumpulkan metrik, Grafana menampilkan,
    # cAdvisor memberi metrik per container, node-exporter metrik host.
    # Port monitoring hanya dibuka di 127.0.0.1 (tidak ke jaringan luar).
    # ---------------------------------------------------------------
    prometheus:
        image: prom/prometheus:v3.15.1
        restart: unless-stopped
        logging: *default-logging
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
            - prometheus_data:/prometheus
        ports:
            - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    grafana:
        image: grafana/grafana:13.2.6
        restart: unless-stopped
        logging: *default-logging
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            # Wajib diisi di .env; compose menolak jalan jika kosong.
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?isi GRAFANA_ADMIN_PASSWORD di .env}
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
        volumes:
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        ports:
            - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    cadvisor:
        image: ghcr.io/google/cadvisor:v0.60.6
        restart: unless-stopped
        logging: *default-logging
        privileged: true
        devices:
            - /dev/kmsg
        command:
            - --docker_only=true
            - --housekeeping_interval=10s
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro

    node-exporter:
        image: prom/node-exporter:v1.12.1
        restart: unless-stopped
        logging: *default-logging
        command:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/rootfs
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro

volumes:
    db_data:
    prometheus_data:
    grafana_data:
