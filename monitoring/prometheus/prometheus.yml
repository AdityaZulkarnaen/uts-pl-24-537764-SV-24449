global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus memantau dirinya sendiri.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrik HTTP backend (FrankenPHP/Caddy): jumlah request, durasi, kode status.
  - job_name: backend
    static_configs:
      - targets: ["backend:2019"]

  # CPU, memori, jaringan per container.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # CPU, memori, disk mesin host (VM Docker).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
